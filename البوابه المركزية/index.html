<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة النظام المركزي - بن الغرباوي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl w-full max-w-md p-8 shadow-2xl text-center">
        
        <!-- Logo -->
        <div class="w-36 h-36 rounded-3xl flex items-center justify-center mx-auto mb-5 shadow-xl overflow-hidden bg-white p-2 border-2 border-amber-500/30">
            <img src="https://i.postimg.cc/LshDFtny/logo-01.png" alt="شعار بن الغرباوي" class="w-full h-full object-contain" onerror="this.parentElement.innerHTML='☕'">
        </div>
        
        <h1 class="text-2xl font-bold text-amber-600 dark:text-amber-500 mb-1">بن الغرباوي</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">بوابة الإدارة المركزية للنظام</p>
        
        <!-- Login Form Container -->
        <div id="loginFormContainer" class="space-y-4 text-right">
            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">اختر حساب الدخول:</label>
                <select id="portalRole" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-slate-800 dark:text-slate-100">
                    <option value="master">المدير العام (Master Admin)</option>
                    <option value="recruitment">مسؤول طلبات التوظيف</option>
                    <option value="hr">مسؤول إدارة الموظفين</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">كلمة المرور:</label>
                <input type="password" id="portalPassword" placeholder="أدخل كلمة المرور الخاصة بالحساب" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-slate-800 dark:text-slate-100">
            </div>

            <!-- Error Message -->
            <p id="errorMessage" class="text-rose-500 text-xs text-center hidden font-semibold">كلمة المرور غير صحيحة لهذا الحساب!</p>

            <!-- Login Button -->
            <button onclick="handlePortalLogin()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm mt-2">
                دخول للنظام 🚀
            </button>
        </div>

        <!-- Master Dashboard Options (Shows only when logged in as Master Admin) -->
        <div id="masterDashboard" class="space-y-4 text-right hidden">
            <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-700/50 rounded-2xl p-4 mb-4 text-center">
                <h3 class="text-sm font-bold text-amber-700 dark:text-amber-400">مرحباً بك يا مدير عام النظام</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">اختر القسم الذي تريد الانتقال إليه:</p>
            </div>

            <a href="hr.html" onclick="setSession('admin')" class="block w-full bg-slate-50 dark:bg-slate-900 hover:bg-amber-600 hover:text-white border border-slate-300 dark:border-slate-700 rounded-xl p-4 text-center font-bold text-sm transition shadow">
                👥 نظام إدارة موظفي الفروع
            </a>

            <a href="admin.html" onclick="setSession('recruitment')" class="block w-full bg-slate-50 dark:bg-slate-900 hover:bg-amber-600 hover:text-white border border-slate-300 dark:border-slate-700 rounded-xl p-4 text-center font-bold text-sm transition shadow">
                📋 لوحة متابعة طلبات التوظيف
            </a>

            <button onclick="location.reload()" class="w-full bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 py-2.5 rounded-xl text-xs font-semibold transition mt-2">
                تسجيل خروج 🚪
            </button>
        </div>

    </div>

    <script>
        function handlePortalLogin() {
            const role = document.getElementById('portalRole').value;
            const password = document.getElementById('portalPassword').value.trim();
            const errorMsg = document.getElementById('errorMessage');

            errorMsg.classList.add('hidden');

            if (role === 'master') {
                if (password === 'algharabawy') {
                    sessionStorage.setItem('auth_session', 'active');
                    sessionStorage.setItem('gharbawee_role', 'master');
                    document.getElementById('loginFormContainer').classList.add('hidden');
                    document.getElementById('masterDashboard').classList.remove('hidden');
                } else {
                    errorMsg.classList.remove('hidden');
                }
            } 
            else if (role === 'recruitment') {
                if (password === 'algharabawy1') {
                    sessionStorage.setItem('auth_session', 'active');
                    sessionStorage.setItem('gharbawee_role', 'recruitment');
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.classList.remove('hidden');
                }
            } 
            else if (role === 'hr') {
                if (password === 'algharabawy2') {
                    sessionStorage.setItem('auth_session', 'active');
                    sessionStorage.setItem('gharbawee_role', 'admin');
                    window.location.href = 'hr.html';
                } else {
                    errorMsg.classList.remove('hidden');
                }
            }
        }

        function setSession(roleType) {
            sessionStorage.setItem('auth_session', 'active');
            sessionStorage.setItem('gharbawee_role', roleType);
        }
    </script>
</body>
</html>
