<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بن الغرباوي - لوحة تحكم ومتابعة الدعم الفني</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-7xl space-y-6">
        
        <!-- الشريط العلوي -->
        <header class="bg-amber-900 text-white shadow-md rounded-2xl px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white px-2 py-1 rounded-lg shadow-sm flex items-center justify-center">
                    <img src="https://i.postimg.cc/LshDFtny/logo-01.png" alt="بن الغرباوي" class="h-8 w-auto object-contain">
                </div>
                <div>
                    <h1 class="text-lg font-bold">لوحة تحكم الدعم الفني (إدارة وصيانة الفروع)</h1>
                    <span class="text-xs text-amber-200">متابعة وعلاج أعطال جميع الفروع</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="loadAllTickets()" class="bg-amber-700 hover:bg-amber-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">
                    🔄 تحديث البلاغات
                </button>
                <a href="index.html" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">
                    🏠 البوابة المركزية
                </a>
            </div>
        </header>

        <!-- جدول الاستقبال والمتابعة -->
        <main class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h3 class="font-bold text-gray-800 text-base">📋 كافة بلاغات الصيانة الواردة من الفروع</h3>
                <span id="ticketCountBadge" class="text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-full">0 بلاغ</span>
            </div>

            <div class="overflow-x-auto flex-1">
                <table class="w-full text-right text-xs">
                    <thead class="bg-amber-900 text-white">
                        <tr>
                            <th class="p-3">رقم البلاغ والتاريخ</th>
                            <th class="p-3">الفرع</th>
                            <th class="p-3">نوع العطل</th>
                            <th class="p-3">الأولوية</th>
                            <th class="p-3">التفاصيل</th>
                            <th class="p-3">الحالة الحالية</th>
                            <th class="p-3 text-center">إجراءات فريق الدعم</th>
                        </tr>
                    </thead>
                    <tbody id="allTicketsTableBody" class="divide-y divide-gray-200 text-gray-700">
                        <tr><td colspan="7" class="text-center p-6 text-gray-400">جاري تحميل البلاغات...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>

    </div>

    <script>
        const SUPABASE_URL = 'https://csroadhvynbSksqncrur.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_oGcXPVopb4DItZ2LY6V1vQ_bQ3vf30C';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            loadAllTickets();
        });

        async function loadAllTickets() {
            try {
                let { data, error } = await supabaseClient
                    .from('maintenance_tickets')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!error) {
                    renderAllTickets(data || []);
                } else {
                    console.error('خطأ:', error);
                    document.getElementById('allTicketsTableBody').innerHTML = `<tr><td colspan="7" class="text-center p-6 text-red-500 font-bold">تأكد من وجود جدول maintenance_tickets في Supabase.</td></tr>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderAllTickets(tickets) {
            const tbody = document.getElementById('allTicketsTableBody');
            tbody.innerHTML = '';
            document.getElementById('ticketCountBadge').textContent = `${tickets.length} بلاغ`;

            if (tickets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-gray-400">لا توجد بلاغات صيانة مسجلة حتى الآن.</td></tr>`;
                return;
            }

            tickets.forEach(ticket => {
                let d = ticket.created_at ? new Date(ticket.created_at).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' }) : '---';
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-amber-50/40 transition";
                tr.innerHTML = `
                    <td class="p-3 font-bold text-amber-900">
                        #${ticket.id}
                        <div class="text-[10px] text-gray-400 font-normal">${d}</div>
                    </td>
                    <td class="p-3 font-semibold text-blue-900">${ticket.branch_name}</td>
                    <td class="p-3">${ticket.category}</td>
                    <td class="p-3">
                        <span class="px-2 py-0.5 rounded font-bold text-[10px] ${ticket.priority.includes('عاجل') ? 'bg-red-100 text-red-800 animate-pulse' : 'bg-green-100 text-green-800'}">
                            ${ticket.priority}
                        </span>
                    </td>
                    <td class="p-3 max-w-xs text-gray-800">${ticket.description}</td>
                    <td class="p-3">
                        <span class="px-2 py-1 rounded font-bold text-[11px] ${
                            ticket.status.includes('جديد') ? 'bg-blue-100 text-blue-800' :
                            ticket.status.includes('جاري') ? 'bg-amber-100 text-amber-800' :
                            'bg-emerald-100 text-emerald-800'
                        }">${ticket.status}</span>
                    </td>
                    <td class="p-3 text-center">
                        <select onchange="updateTicketStatus('${ticket.id}', this.value)" class="bg-white border text-xs p-1 rounded font-semibold focus:outline-none">
                            <option value="" disabled selected>تحديث الحالة...</option>
                            <option value="جديد (في انتظار المعاينة)">جديد</option>
                            <option value="جاري الإصلاح والدعم">جاري الإصلاح</option>
                            <option value="تم حل المشكلة وإغلاق البلاغ">تم الحل وإغلاق البلاغ</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function updateTicketStatus(ticketId, newStatus) {
            let { error } = await supabaseClient.from('maintenance_tickets').update({ status: newStatus }).eq('id', ticketId);
            if (error) {
                alert('خطأ أثناء تحديث حالة البلاغ.');
            } else {
                loadAllTickets();
            }
        }
    </script>
</body>
</html>
