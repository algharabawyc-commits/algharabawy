<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بن الغرباوي - لوحة متابعة طلبات التوظيف</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #121212; color: #e5e7eb; }
        .card { background-color: #1e1e1e; border: 1px solid #2d2d2d; transition: 0.3s; }
        .card:hover { border-color: #C5A059; }
        input { background-color: #2a2a2a !important; border-color: #3f3f3f !important; color: white !important; }
        input:focus { border-color: #C5A059 !important; outline: none; }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="fixed inset-0 bg-[#121212] flex items-center justify-center z-50 p-4">
        <div class="bg-[#1a1a1a] border border-gray-800 rounded-2xl p-8 max-w-md w-full shadow-2xl text-center">
            <div class="w-14 h-14 rounded-full bg-[#4A2E18] border border-amber-600 flex items-center justify-center text-amber-400 font-bold text-xl mx-auto mb-4 shadow-inner">
                🔒
            </div>
            <h1 class="text-xl font-bold text-amber-500 mb-2">تسجيل دخول المشرف</h1>
            <p class="text-xs text-gray-400 mb-6">يرجى إدخال كلمة المرور للوصول إلى لوحة طلبات بن الغرباوي</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="adminPassword" required placeholder="كلمة المرور..." class="w-full px-4 py-3 rounded-xl border text-sm text-center">
                <button type="submit" class="w-full bg-[#4A2E18] hover:bg-[#5c391f] text-amber-300 py-3 rounded-xl text-sm font-bold transition border border-amber-600/30 shadow-md">
                    دخول لوحة التحكم
                </button>
                <p id="loginError" class="text-red-400 text-xs hidden font-semibold">كلمة المرور غير صحيحة، حاول مرة أخرى.</p>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboardContent" class="hidden container mx-auto max-w-5xl">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-[#1a1a1a] border border-gray-800 rounded-2xl p-6 mb-8 shadow-2xl gap-4">
            <div>
                <h1 class="text-2xl font-bold text-amber-500">طلبات التوظيف المقدمة</h1>
                <p class="text-xs text-gray-400 mt-1">عرض ومتابعة طلبات شركة بن الغرباوي شاملة الخبرات والبيانات والسير الذاتية</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="logout()" class="bg-red-900/40 hover:bg-red-900/60 text-red-300 px-4 py-2.5 rounded-xl text-sm font-semibold transition border border-red-700/30 shadow-md">
                    🔒 تسجيل خروج
                </button>
                <button onclick="loadApplications()" class="bg-[#4A2E18] hover:bg-[#5c391f] text-amber-300 px-5 py-2.5 rounded-xl text-sm font-semibold transition border border-amber-600/30 shadow-md">
                    🔄 تحديث الطلبات
                </button>
            </div>
        </div>

        <!-- Applications Container -->
        <div id="loading" class="text-center py-10 text-gray-400">جاري تحميل الطلبات...</div>
        <div id="appsList" class="grid grid-cols-1 gap-6"></div>
    </div>

    <!-- Script النظام -->
    <script>
        const SUPABASE_URL = 'https://csroadhvynbsksqncrur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oGcXPVopb4DItZ2LY6V1vQ_bQ3vf30C';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let applicationsData = [];

        // التحقق من الدخول التلقائي
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('auth_session') === 'active') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardContent').classList.remove('hidden');
                loadApplications();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('loginError');

            if (pass === 'algharabawy') {
                sessionStorage.setItem('auth_session', 'active');
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardContent').classList.remove('hidden');
                loadApplications();
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('adminPassword').value = '';
            }
        }

        function logout() {
            sessionStorage.clear();
            window.location.reload();
        }

        async function loadApplications() {
            const listDiv = document.getElementById('appsList');
            const loadingDiv = document.getElementById('loading');
            
            loadingDiv.style.display = 'block';
            listDiv.innerHTML = '';

            const { data, error } = await _supabase
                .from('job_applications')
                .select('*')
                .order('created_at', { ascending: false });

            loadingDiv.style.display = 'none';

            if (error) {
                alert('حدث خطأ أثناء تحميل البيانات: ' + error.message);
                return;
            }

            applicationsData = data;

            if (applicationsData.length === 0) {
                listDiv.innerHTML = '<div class="text-center py-10 text-gray-500 bg-[#1e1e1e] rounded-2xl border border-gray-800">لا توجد طلبات توظيف حتى الآن.</div>';
                return;
            }

            applicationsData.forEach((app, index) => {
                const date = new Date(app.created_at).toLocaleString('ar-EG');
                const photoSrc = app.personal_photo ? app.personal_photo : 'https://via.placeholder.com/100?text=No+Photo';
                
                // زر الاطلاع على الـ CV إذا كان مرفقاً
                const cvButton = app.cv_url 
                    ? `<a href="${app.cv_url}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow">📄 الاطلاع على الـ CV</a>`
                    : `<span class="text-xs text-gray-500 bg-[#121212] px-3 py-2 rounded-xl border border-gray-800">لا يوجد CV مرفق</span>`;

                const card = document.createElement('div');
                card.className = 'card rounded-2xl p-6 shadow-lg';
                card.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-800 pb-4 mb-4 gap-4">
                        <div class="flex items-center gap-4">
                            <img src="${photoSrc}" alt="صورة المتقدم" class="w-16 h-16 rounded-xl object-cover border border-amber-600/40 bg-black shrink-0">
                            <div>
                                <span class="bg-amber-500/10 text-amber-400 text-xs px-3 py-1 rounded-full border border-amber-500/20 font-semibold">متقدم لوظيفة: ${app.job_applied_for || 'غير محدد'}</span>
                                <h2 class="text-xl font-bold text-white mt-2">${app.name_in_full}</h2>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="text-xs text-gray-400 ml-2">📅 ${date}</span>
                            ${cvButton}
                            <button onclick="printApplication(${index})" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow">
                                🖨️ طباعة الطلب
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-gray-300 mb-4">
                        <div>📞 <strong>الهاتف:</strong> <a href="tel:${app.telephone_no}" class="text-amber-400 hover:underline">${app.telephone_no}</a></div>
                        <div>📍 <strong>العنوان:</strong> ${app.local_address}</div>
                        <div>🆔 <strong>الرقم القومي:</strong> ${app.national_id_no || 'غير متوفر'}</div>
                        <div>🎓 <strong>المؤهل:</strong> ${app.certificate_degree || '-'} (${app.certificate_major || '-'})</div>
                        <div>⭐ <strong>التقدير:</strong> ${app.certificate_grade || '-'}</div>
                        <div>🏛️ <strong>الجامعة:</strong> ${app.university_school || '-'} (${app.year_passed || '-'})</div>
                    </div>

                    <div class="bg-[#121212] p-4 rounded-xl text-xs text-gray-300 border border-gray-800 space-y-2 mb-3">
                        <div class="font-bold text-amber-400 mb-1">💼 الخبرات العملية المسجلة:</div>
                        <div>1- الوظيفة: ${app.exp_position_1 || '-'} | الجهة: ${app.exp_employer_1 || '-'} | الراتب: ${app.exp_salary_1 || '-'}</div>
                        <div>2- الوظيفة: ${app.exp_position_2 || '-'} | الجهة: ${app.exp_employer_2 || '-'} | الراتب: ${app.exp_salary_2 || '-'}</div>
                    </div>

                    <div class="bg-[#121212] p-3 rounded-xl text-xs text-gray-400 flex flex-wrap justify-between items-center border border-gray-800 gap-2">
                        <span>الديانة: ${app.religion || '-'}</span>
                        <span>الحالة الاجتماعية: ${app.marital_status || '-'}</span>
                        <span>الجنس: ${app.sex || '-'}</span>
                        <span>اللغات: ${app.languages_known || '-'}</span>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        }

        function printApplication(index) {
            const app = applicationsData[index];
            const printWindow = window.open('', '_blank');
            const photoSrc = app.personal_photo ? app.personal_photo : '';
            
            const htmlContent = `
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <title>طلب توظيف - ${app.name_in_full}</title>
                    <style>
                        body { font-family: 'Cairo', Arial, sans-serif; padding: 20px; color: #000; direction: rtl; background: #fff; font-size: 12px; }
                        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4A2E18; padding-bottom: 10px; margin-bottom: 15px; }
                        .header-text h1 { color: #4A2E18; margin: 0; font-size: 22px; }
                        .header-text p { color: #666; margin: 3px 0 0; font-size: 12px; }
                        .applicant-photo { width: 75px; height: 85px; object-fit: cover; border: 1px solid #4A2E18; border-radius: 4px; }
                        h2 { font-size: 13px; background: #f4f0ea; color: #4A2E18; padding: 5px 8px; margin-top: 12px; border-right: 4px solid #4A2E18; }
                        table { width: 100%; border-collapse: collapse; margin-top: 5px; margin-bottom: 8px; }
                        th, td { border: 1px solid #ccc; padding: 5px 8px; font-size: 11px; text-align: right; }
                        th { background-color: #faf8f5; color: #333; }
                        .full-row { width: 80%; }
                        .footer { margin-top: 25px; display: flex; justify-content: space-between; font-size: 12px; }
                        @media print { body { padding: 0; } }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="header-text">
                            <h1>شركة بن الغرباوي</h1>
                            <p>طلب توظيف - Employment Application Form</p>
                        </div>
                        ${photoSrc ? `<img src="${photoSrc}" class="applicant-photo" alt="صورة المتقدم">` : ''}
                    </div>

                    <div style="margin-bottom: 12px; font-size: 14px; font-weight: bold; background: #fff8e1; padding: 6px; border: 1px solid #ffe082; display: flex; justify-content: space-between;">
                        <span>الوظيفة المتقدم لها: <span style="color: #b71c1c;">${app.job_applied_for || 'غير محدد'}</span></span>
                        ${app.cv_url ? `<span>مرفق سيرة ذاتية (CV)</span>` : ''}
                    </div>

                    <h2>البيانات الشخصية (Personnel Data)</h2>
                    <table>
                        <tr>
                            <th>الاسم ثلاثي</th><td>${app.name_in_full || ''}</td>
                            <th>الجنسية</th><td>${app.nationality || ''}</td>
                        </tr>
                        <tr>
                            <th>تاريخ الميلاد</th><td>${app.date_of_birth || ''}</td>
                            <th>الديانة</th><td>${app.religion || ''}</td>
                        </tr>
                        <tr>
                            <th>الجنس</th><td>${app.sex || ''}</td>
                            <th>الحالة الاجتماعية</th><td>${app.marital_status || ''}</td>
                        </tr>
                        <tr>
                            <th>الرقم القومي</th><td>${app.national_id_no || ''}</td>
                            <th>رقم جواز السفر</th><td>${app.passport_no || ''}</td>
                        </tr>
                        <tr>
                            <th>رخصة القيادة</th><td>${app.license_no || ''}</td>
                            <th>نوع الرخصة / الانتهاء</th><td>${app.license_type || ''} (${app.license_expiry_date || ''})</td>
                        </tr>
                    </table>

                    <h2>بيانات الاتصال والعنوان (Contact Data)</h2>
                    <table>
                        <tr>
                            <th>العنوان الحالي</th><td colspan="3" class="full-row">${app.local_address || ''}</td>
                        </tr>
                        <tr>
                            <th>رقم الهاتف / واتساب</th><td>${app.telephone_no || ''}</td>
                            <th>هل تعمل حالياً؟</th><td>${app.currently_employed || ''}</td>
                        </tr>
                    </table>

                    <h2>المؤهلات التعليمية (Educational Data)</h2>
                    <table>
                        <tr>
                            <th>الشهادة (Degree)</th>
                            <th>التقدير (Grade)</th>
                            <th>التخصص (Major)</th>
                            <th>الجامعة / المدرسة</th>
                            <th>البلد</th>
                            <th>سنة التخرج</th>
                        </tr>
                        <tr>
                            <td>${app.certificate_degree || '-'}</td>
                            <td>${app.certificate_grade || '-'}</td>
                            <td>${app.certificate_major || '-'}</td>
                            <td>${app.university_school || '-'}</td>
                            <td>${app.country || '-'}</td>
                            <td>${app.year_passed || '-'}</td>
                        </tr>
                    </table>

                    <h2>الخبرات العملية (Experience)</h2>
                    <table>
                        <tr>
                            <th>الوظيفة</th>
                            <th>صاحب العمل / المنشأة</th>
                            <th>تاريخ الالتحاق</th>
                            <th>تاريخ ترك العمل</th>
                            <th>الراتب</th>
                            <th>سبب الترك</th>
                        </tr>
                        <tr>
                            <td>${app.exp_position_1 || '-'}</td>
                            <td>${app.exp_employer_1 || '-'}</td>
                            <td>${app.exp_joining_1 || '-'}</td>
                            <td>${app.exp_leave_1 || '-'}</td>
                            <td>${app.exp_salary_1 || '-'}</td>
                            <td>${app.exp_reason_1 || '-'}</td>
                        </tr>
                        <tr>
                            <td>${app.exp_position_2 || '-'}</td>
                            <td>${app.exp_employer_2 || '-'}</td>
                            <td>${app.exp_joining_2 || '-'}</td>
                            <td>${app.exp_leave_2 || '-'}</td>
                            <td>${app.exp_salary_2 || '-'}</td>
                        </tr>
                    </table>

                    <h2>الأشخاص يمكن الرجوع إليهم (References)</h2>
                    <table>
                        <tr>
                            <th>الاسم</th>
                            <th>صلة القرابة / العمل</th>
                            <th>رقم التليفون</th>
                            <th>العنوان</th>
                        </tr>
                        <tr>
                            <td>${app.ref_name_1 || '-'}</td>
                            <td>${app.ref_relation_1 || '-'}</td>
                            <td>${app.ref_tel_1 || '-'}</td>
                            <td>${app.ref_address_1 || '-'}</td>
                        </tr>
                        <tr>
                            <td>${app.ref_name_2 || '-'}</td>
                            <td>${app.ref_relation_2 || '-'}</td>
                            <td>${app.ref_tel_2 || '-'}</td>
                            <td>${app.ref_address_2 || '-'}</td>
                        </tr>
                    </table>

                    <h2>اللغات (Languages Known)</h2>
                    <div style="border: 1px solid #ccc; padding: 6px; font-size: 11px; background: #faf8f5;">
                        ${app.languages_known || 'غير محدد'}
                    </div>

                    <div class="footer">
                        <div>توقيع الموظف المسؤول: ........................</div>
                        <div>تاريخ المراجعة: ____/____/2026</div>
                    </div>
                </body>
                </html>
            `;

            printWindow.document.write(htmlContent);
            printWindow.document.close();
            
            setTimeout(() => {
                printWindow.print();
            }, 600);
        }
    </script>
</body>
</html>
