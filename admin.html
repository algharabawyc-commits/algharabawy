<script>
        const SUPABASE_URL = 'https://csroadhvynbsksqncrur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oGcXPVopb4DItZ2LY6V1vQ_bQ3vf30C';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allApplications = [];

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('auth_session') === 'active') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardContent').classList.remove('hidden');
                loadApplications();
                initRealtimeListener();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('loginError');

            if (pass === 'algharabawy') {
                sessionStorage.setItem('auth_session', 'active');
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardContent').classList.remove('hidden');
                loadApplications();
                initRealtimeListener();
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('adminPassword').value = '';
            }
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); 

                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.6);
            } catch (e) {
                console.log('Audio playback prevented', e);
            }
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-animate bg-amber-500 text-black font-bold px-4 py-3 rounded-xl shadow-2xl border border-amber-300 flex items-center justify-between pointer-events-auto text-sm';
            toast.innerHTML = `
                <span>${message}</span>
                <button onclick="this.parentElement.remove()" class="ml-2 text-black hover:opacity-70 font-bold">✕</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 6000);
        }

        function initRealtimeListener() {
            _supabase
                .channel('public:job_applications_live')
                .on(
                    'postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'job_applications' },
                    (payload) => {
                        console.log('New application detected:', payload);
                        playNotificationSound();
                        const newApp = payload.new;
                        showToast(`🔔 متقدم جديد: ${newApp.name_in_full} (${newApp.job_applied_for || 'وظيفة جديدة'})`);
                        loadApplications();
                    }
                )
                .subscribe((status) => {
                    console.log('Realtime Status:', status);
                });
        }

        async function loadApplications() {
            const tbody = document.getElementById('appTableBody');
            const loadingDiv = document.getElementById('loading');
            
            loadingDiv.style.display = 'block';
            tbody.innerHTML = '';

            const { data, error } = await _supabase
                .from('job_applications')
                .select('*')
                .order('created_at', { ascending: false });

            loadingDiv.style.display = 'none';

            if (error) {
                alert('خطأ في جلب البيانات: ' + error.message);
                return;
            }

            allApplications = data || [];
            renderTable(allApplications);
        }

        function renderTable(data) {
            const tbody = document.getElementById('appTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-gray-500">لا توجد طلبات مطابقة للبحث أو التصفية.</td></tr>`;
                return;
            }

            data.forEach((app) => {
                let statusBadge = '';
                const currentStatus = app.status || 'قيد المراجعة';
                if (currentStatus === 'تم القبول للمقابلة') {
                    statusBadge = '<span class="px-2 py-1 bg-emerald-900/50 text-emerald-300 rounded-md border border-emerald-700">تم القبول للمقابلة</span>';
                } else if (currentStatus === 'مرفوض') {
                    statusBadge = '<span class="px-2 py-1 bg-red-900/50 text-red-300 rounded-md border border-red-700">مرفوض</span>';
                } else {
                    statusBadge = '<span class="px-2 py-1 bg-amber-900/50 text-amber-300 rounded-md border border-amber-700">قيد المراجعة</span>';
                }

                let tr = document.createElement('tr');
                tr.className = 'hover:bg-[#252525] transition';
                tr.innerHTML = `
                    <td class="p-3 font-bold text-white flex items-center gap-2">
                        ${app.personal_photo ? `<img src="${app.personal_photo}" class="w-8 h-8 rounded-full object-cover border border-amber-600/40">` : `<div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-[10px]">بدون</div>`}
                        ${app.name_in_full}
                    </td>
                    <td class="p-3 text-amber-200">${app.job_applied_for || 'غير محدد'}</td>
                    <td class="p-3 font-mono"><a href="tel:${app.telephone_no}" class="hover:underline text-amber-400">${app.telephone_no}</a></td>
                    <td class="p-3">${app.certificate_degree || '-'} (${app.certificate_grade || '-'})</td>
                    <td class="p-3">${statusBadge}</td>
                    <td class="p-3 text-gray-300">${app.interview_date ? new Date(app.interview_date).toLocaleString('ar-EG') : 'لم تحدد'}</td>
                    <td class="p-3 text-center space-x-1 space-x-reverse">
                        <button onclick='viewDetails(${JSON.stringify(app)})' class="bg-blue-900/60 text-blue-200 px-2.5 py-1 rounded-lg border border-blue-700 hover:bg-blue-800">عرض</button>
                        <button onclick='openInterviewModal("${app.id}", "${app.telephone_no}", "${app.name_in_full}", "${currentStatus}", "${app.interview_date || ''}")' class="bg-amber-900/60 text-amber-200 px-2.5 py-1 rounded-lg border border-amber-700 hover:bg-amber-800">إدارة</button>
                        ${app.cv_url ? `<a href="${app.cv_url}" target="_blank" class="bg-emerald-900/60 text-emerald-200 px-2.5 py-1 rounded-lg border border-emerald-700 inline-block hover:bg-emerald-800">CV</a>` : ''}
                        <button onclick='printApplicationRecord(${JSON.stringify(app)})' class="bg-purple-900/60 text-purple-200 px-2.5 py-1 rounded-lg border border-purple-700 hover:bg-purple-800">طباعة</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const jobFilter = document.getElementById('filterJob').value.toLowerCase();
            const gradeFilter = document.getElementById('filterGrade').value;
            const statusFilter = document.getElementById('filterStatus').value;

            const filtered = allApplications.filter(app => {
                const matchSearch = app.name_in_full.toLowerCase().includes(search) || app.telephone_no.includes(search);
                const matchJob = (app.job_applied_for || '').toLowerCase().includes(jobFilter);
                const matchGrade = gradeFilter === '' || app.certificate_grade === gradeFilter;
                const matchStatus = statusFilter === '' || (app.status || 'قيد المراجعة') === statusFilter;
                return matchSearch && matchJob && matchGrade && matchStatus;
            });

            renderTable(filtered);
        }

        function viewDetails(app) {
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-[#121212] p-4 rounded-xl border border-gray-800">
                    <p><b>الاسم الكامل:</b> ${app.name_in_full}</p>
                    <p><b>الوظيفة المتقدم لها:</b> ${app.job_applied_for || '-'}</p>
                    <p><b>رقم الهاتف / واتساب:</b> ${app.telephone_no}</p>
                    <p><b>الرقم القومي:</b> ${app.national_id_no || 'غير متوفر'}</p>
                    <p><b>العنوان الحالي:</b> ${app.local_address || '-'}</p>
                    <p><b>تاريخ الميلاد:</b> ${app.date_of_birth || 'غير متوفر'}</p>
                    <p><b>الحالة الاجتماعية:</b> ${app.marital_status || '-'}</p>
                    <p><b>الديانة والجنس:</b> ${app.religion || '-'} / ${app.sex || '-'}</p>
                    <p><b>الشهادة والتقدير:</b> ${app.certificate_degree || ''} - ${app.certificate_grade || ''} (${app.certificate_major || ''})</p>
                    <p><b>الجامعة / المدرسة:</b> ${app.university_school || '-'} (${app.year_passed || '-'})</p>
                    <p><b>هل يعمل حالياً:</b> ${app.currently_employed || 'لا'}</p>
                    <p><b>اللغات:</b> ${app.languages_known || '-'}</p>
                </div>
                <div class="mt-4 bg-[#121212] p-4 rounded-xl border border-gray-800">
                    <h4 class="font-bold text-amber-400 mb-2">الخبرات العملية المسجلة:</h4>
                    <p><b>1- الوظيفة:</b> ${app.exp_position_1 || '-'} | الجهة: ${app.exp_employer_1 || '-'} | الراتب: ${app.exp_salary_1 || '-'}</p>
                    <p class="mt-1"><b>2- الوظيفة:</b> ${app.exp_position_2 || '-'} | الجهة: ${app.exp_employer_2 || '-'} | الراتب: ${app.exp_salary_2 || '-'}</p>
                </div>
            `;
            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function openInterviewModal(id, phone, name, status, interviewDate) {
            document.getElementById('currentAppId').value = id;
            document.getElementById('currentAppPhone').value = phone;
            document.getElementById('currentAppName').value = name;
            document.getElementById('updateStatusSelect').value = status;
            
            if (interviewDate) {
                const dateObj = new Date(interviewDate);
                const tzOffset = dateObj.getTimezoneOffset() * 60000;
                const localISOTime = (new Date(dateObj - tzOffset)).toISOString().slice(0, 16);
                document.getElementById('interviewDateTime').value = localISOTime;
            } else {
                document.getElementById('interviewDateTime').value = '';
            }

            document.getElementById('interviewModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        async function saveInterviewAndStatus() {
            const id = document.getElementById('currentAppId').value;
            const phone = document.getElementById('currentAppPhone').value;
            const name = document.getElementById('currentAppName').value;
            const status = document.getElementById('updateStatusSelect').value;
            const interviewDate = document.getElementById('interviewDateTime').value;

            const { error } = await _supabase
                .from('job_applications')
                .update({ 
                    status: status, 
                    interview_date: interviewDate ? interviewDate : null 
                })
                .eq('id', id);

            if (error) {
                alert('حدث خطأ أثناء التحديث: ' + error.message);
                return;
            }

            alert('تم تحديث حالة الطلب وموعد المقابلة بنجاح!');
            closeModal('interviewModal');
            loadApplications();

            if (status === 'تم القبول للمقابلة' && interviewDate) {
                let formattedDate = new Date(interviewDate).toLocaleString('ar-EG');
                let waMessage = `مرحباً الأستاذ/ة ${name}،\nنحيطك علماً بأنه تم قبول طلبك المبدئي للعمل في فروع (بن الغرباوي).\nتم تحديد موعد المقابلة الشخصية بتاريخ: ${formattedDate}.\nنتمنى لك التوفيق!`;
                let cleanPhone = phone.startsWith('0') ? '2' + phone : phone; 
                window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(waMessage)}`, '_blank');
            }
        }

                </head>
                <body>
                    <div class="header">

                    <div style="margin-bottom: 12px; font-size: 14px; font-weight: bold; background: #fff8e1; padding: 6px; border: 1px solid #ffe082; display: flex; justify-content: space-between;">
                        <span>الوظيفة المتقدم لها: <span style="color: #b71c1c;">${app.job_applied_for || 'غير محدد'}</span></span>

                    <h2>البيانات الشخصية (Personnel Data)</h2>

                        <tr>
                            <th>الرقم القومي</th><td>${app.national_id_no || ''}</td>
                            <th>رقم جواز السفر</th><td>${app.passport_no || ''}</td>

                    </table>

                    <h2>بيانات الاتصال والعنوان (Contact Data)</h2>
                    <table>
                        <tr>
                            <th>العنوان الحالي</th><td colspan="3" class="full-row">${app.local_address || ''}</td>
                        </tr>
                        <tr>
                            <th>رقم الهاتف / واتساب</th><td>${app.telephone_no || ''}</td>
                            <th>هل تعمل حالياً؟</th><td>${app.currently_employed || ''}</td>
                        </tr>
                    </table>

                    <h2>المؤهلات التعليمية (Educational Data)</h2>
                    <table>
                        <tr>
                            <th>الشهادة (Degree)</th>

                        </tr>
                        <tr>
                            <td>${app.certificate_degree || '-'}</td>

                    <h2>الخبرات العملية (Experience)</h2>

                        <tr>
                            <td>${app.exp_position_1 || '-'}</td>

                    <div class="footer">

            printWindow.document.write(htmlContent);
            printWindow.document.close();
            setTimeout(() => { printWindow.print(); }, 600);

    </script>
